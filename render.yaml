# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: cosmic-watch-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cosmic_watch.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: RUN_PIPELINE          # fetch live data inside the web process
        value: "1"
      - key: DETECT_MAX_SIDE       # keep memory inside the free 512 MB
        value: "2000"
      - key: MAST_MAX_PER_RUN
        value: "5"
